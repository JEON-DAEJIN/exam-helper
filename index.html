<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시험공부 도우미</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="시험공부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#6c4ef5">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f6f4ff; --panel:#ffffff; --ink:#1f1d2b; --muted:#6b6880; --line:#e4e0f2;
  --brand:#6c4ef5; --brand-ink:#ffffff; --brand-soft:#ece7ff;
  --ok:#14955b; --ok-soft:#e1f6ec; --bad:#d63b4f; --bad-soft:#fde6e9; --mid:#c77a00; --mid-soft:#fff2db;
  --shadow:0 2px 10px rgba(60,40,140,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15131f; --panel:#201d2e; --ink:#eeeaf8; --muted:#a6a1bd; --line:#363149;
    --brand:#8f78ff; --brand-ink:#ffffff; --brand-soft:#2c2645;
    --ok:#3ccf8a; --ok-soft:#173528; --bad:#ff6b7f; --bad-soft:#3b1d24; --mid:#ffb547; --mid-soft:#3a2d14;
    --shadow:0 2px 10px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:16px;line-height:1.55}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
header.top h1{font-size:22px;margin:0;cursor:pointer}
header.top .sp{flex:1}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.mid{background:var(--mid-soft);color:var(--mid)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:18px}
.panel h3{margin:14px 0 8px;font-size:16px}
.muted{color:var(--muted)} .small{font-size:13px}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
button:hover{border-color:var(--brand)}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
button.pri:hover{filter:brightness(1.08)}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button.big{padding:14px 20px;font-size:17px;border-radius:12px}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
label.f{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
input[type=text],input[type=date],input[type=number],select,textarea{font:inherit;width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.chk{display:inline-flex;align-items:center;gap:6px;margin:4px 12px 4px 0;font-weight:500}
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,var(--brand),#a879ff);color:#fff;border:none}
.hero .num{font-size:40px;font-weight:800;line-height:1}
.hero button{background:#fff;color:#4a2fd6;border:none}
.deck{display:flex;flex-direction:column;gap:8px}
.deck .t{font-weight:700;font-size:17px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.steps{counter-reset:s;padding-left:0;list-style:none}
.steps li{counter-increment:s;padding:6px 0 6px 36px;position:relative}
.steps li:before{content:counter(s);position:absolute;left:0;top:6px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;text-align:center;line-height:26px;font-size:14px}
pre.prompt{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:12px;max-height:260px;overflow:auto;font-size:13px}
/* 플래시카드 */
.fc-area{perspective:1200px;margin:10px auto 16px;max-width:640px}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc{-webkit-transform-style:preserve-3d;-webkit-user-select:none;user-select:none}
.fc .side{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:18px;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;font-size:22px;font-weight:600;white-space:pre-wrap;overflow:auto;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.fc .back{transform:rotateY(180deg);background:var(--brand-soft);font-size:20px}
.fc .tag{position:absolute;top:12px;left:16px;font-size:12px;color:var(--muted);font-weight:600}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:640px;margin:0 auto}
.rate button{padding:14px 6px}
.rate .r1{color:var(--bad)} .rate .r2{color:var(--mid)} .rate .r3{color:var(--ok)}
.prog{max-width:640px;margin:0 auto 6px;display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
/* 문제 */
.q{font-size:18px;font-weight:600;white-space:pre-wrap;margin:6px 0 14px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices button{text-align:left;font-weight:500;padding:12px 14px;white-space:pre-wrap}
.choices button.sel{border-color:var(--brand);background:var(--brand-soft)}
.choices button.right{border-color:var(--ok);background:var(--ok-soft)}
.choices button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ox{display:flex;gap:12px}
.ox button{flex:1;font-size:34px;padding:18px}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px;white-space:pre-wrap}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)} .fb.mid{background:var(--mid-soft)}
.list .item{border-top:1px solid var(--line);padding:10px 0}
.list .item:first-child{border-top:none}
.pre{white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:12px}
#print{display:none}
button,.btn,.fc{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (hover:none){ .kbd{display:none} }
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
@media print{
  body{background:#fff;color:#000}
  .wrap,.toast{display:none!important}
  #print{display:block;padding:10mm;font-size:12pt}
  #print h1{font-size:16pt} #print .pq{margin:0 0 12pt;page-break-inside:avoid}
  #print .ans{page-break-before:always}
}
@media (max-width:560px){ .fc{height:260px} .fc .side{font-size:19px} .hero .num{font-size:32px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 onclick="go('home')">📚 시험공부 도우미</h1>
    <span id="dday"></span>
    <span class="sp"></span>
    <button class="ghost" onclick="go('home')">홈</button>
    <button class="ghost" onclick="go('help')">사용법</button>
  </header>
  <main id="app"></main>
</div>
<div id="print"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<script>
/* ===================== 저장소 ===================== */
const KEY = 'exam-helper-v1';
const DAY = 86400000;
const INTERVALS = [0, 1, 2, 4, 7, 15]; // 상자 0~5에서 다음 복습까지 며칠
const TYPE_NAME = {mc:'객관식', ox:'OX', short:'단답형', blank:'빈칸', essay:'서술형'};

let S = load();
let V = {}; // 현재 화면 상태

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const s = JSON.parse(raw); s.decks = s.decks||[]; s.settings = s.settings||{}; return s; }
  }catch(e){}
  return {decks:[], settings:{level:'고등학생', exam:'중간고사', examDate:''}};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ alert('저장 공간이 부족하거나 저장이 막혀 있어요. 백업 파일을 먼저 저장해 주세요.'); }
}
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const startOfToday = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const deckById = id => S.decks.find(d => d.id === id);
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),1800); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const isDue = c => (c.due||0) <= Date.now();
function copyText(text){
  const done = () => toast('복사했어요! ChatGPT에 붙여넣으세요');
  if(navigator.clipboard && window.isSecureContext !== false){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ alert('복사가 안 되면 글 상자를 직접 전부 선택(Ctrl+A)해서 복사(Ctrl+C)하세요.'); }
  ta.remove();
}

/* ===================== 화면 이동 ===================== */
function go(view, params={}){
  V = Object.assign({view}, params);
  document.onkeydown = null;
  render();
  window.scrollTo(0,0);
}
function render(){
  renderDday();
  const views = {home, create, deck:deckView, flashSetup, flash, quizSetup, quiz, result, wrongs, help, settings};
  $('app').innerHTML = (views[V.view] || home)();
  if(V.after){ const f=V.after; V.after=null; f(); }
}
function renderDday(){
  const d = S.settings.examDate;
  if(!d){ $('dday').innerHTML=''; return; }
  const diff = Math.round((new Date(d+'T00:00:00') - startOfToday())/DAY);
  const label = diff>0 ? `D-${diff}` : diff===0 ? 'D-DAY' : `D+${-diff}`;
  $('dday').innerHTML = `<span class="badge ${diff<=7&&diff>=0?'bad':''}" style="cursor:pointer" onclick="go('settings')">${esc(S.settings.exam||'시험')} ${label}</span>`;
}

/* ===================== 홈 ===================== */
function home(){
  const allDue = S.decks.reduce((n,d)=>n+d.cards.filter(isDue).length,0);
  const subjects = [...new Set(S.decks.map(d=>d.subject||'기타'))];
  let html = `
  <section class="panel hero">
    <div><div class="small">오늘 복습할 카드</div><div class="num">${allDue}장</div></div>
    <span class="sp" style="flex:1"></span>
    <button class="big" ${allDue?'':'disabled'} onclick="startFlash(null,'due')">오늘 복습 시작 ▶</button>
    <button class="big" onclick="go('create')">＋ 새 자료 만들기</button>
  </section>`;
  if(!S.decks.length){
    html += `<section class="panel">
      <h2>처음 오셨네요 👋</h2>
      <p>수업 PDF를 ChatGPT에 넣고, 이 앱이 만들어 주는 <b>부탁 글(프롬프트)</b>을 함께 보내면 플래시카드와 시험문제가 만들어져요. 결과를 여기에 붙여넣으면 끝!</p>
      <div class="row"><button class="pri" onclick="go('create')">첫 자료 만들기</button>
      <button onclick="addSample()">예시 자료로 먼저 구경하기</button>
      <button class="ghost" onclick="go('help')">사용법 보기</button></div>
    </section>`;
  }
  subjects.forEach(sub=>{
    html += `<h3 style="margin:18px 4px 8px">${esc(sub)}</h3><div class="grid">`;
    S.decks.filter(d=>(d.subject||'기타')===sub).forEach(d=>{
      const due=d.cards.filter(isDue).length, learned=d.cards.filter(c=>c.box>=3).length;
      const pct = d.cards.length? Math.round(learned/d.cards.length*100):0;
      const wr = d.questions.filter(q=>q.wrong).length;
      html += `<div class="panel deck">
        <div class="t">${esc(d.title)}</div>
        <div class="small muted">카드 ${d.cards.length} · 문제 ${d.questions.length} ${wr?`· <span style="color:var(--bad)">오답 ${wr}</span>`:''}</div>
        <div class="bar" title="외운 카드 ${pct}%"><i style="width:${pct}%"></i></div>
        <div class="small muted">외운 카드 ${pct}% ${due?`· 오늘 복습 ${due}장`:''}</div>
        <div class="row">
          <button class="pri" onclick="go('flashSetup',{deckId:'${d.id}'})">카드</button>
          <button onclick="go('quizSetup',{deckId:'${d.id}'})">문제 풀기</button>
          <button onclick="go('wrongs',{deckId:'${d.id}'})">오답노트</button>
          <button class="ghost" onclick="go('deck',{deckId:'${d.id}'})">관리</button>
        </div></div>`;
    });
    html += `</div>`;
  });
  html += `<section class="panel" style="margin-top:22px">
    <h2>백업과 설정</h2>
    <p class="small muted">공부 기록은 이 컴퓨터의 브라우저에만 저장돼요. 일주일에 한 번은 백업 파일을 저장해 두세요.</p>
    <div class="row">
      <button onclick="exportAll()">💾 백업 파일 저장</button>
      <button onclick="importAll()">📂 백업 불러오기</button>
      <button onclick="go('settings')">⚙️ 시험 날짜·학년 설정</button>
      ${S.decks.length?'':''}
    </div></section>`;
  return html;
}

/* ===================== 설정 ===================== */
function settings(){
  const s=S.settings;
  return `<section class="panel"><h2>설정</h2>
    <label class="f">학년</label>
    <select id="st_level">${['중학생','고등학생','대학생'].map(x=>`<option ${s.level===x?'selected':''}>${x}</option>`).join('')}</select>
    <label class="f">다가오는 시험 이름</label>
    <input type="text" id="st_exam" value="${esc(s.exam||'')}" placeholder="예: 2학기 기말고사">
    <label class="f">시험 첫날 (D-day 표시)</label>
    <input type="date" id="st_date" value="${esc(s.examDate||'')}">
    <div class="row" style="margin-top:14px"><button class="pri" onclick="saveSettings()">저장</button><button onclick="go('home')">취소</button></div>
  </section>`;
}
function saveSettings(){
  S.settings.level=$('st_level').value; S.settings.exam=$('st_exam').value.trim(); S.settings.examDate=$('st_date').value;
  save(); toast('저장했어요'); go('home');
}

/* ===================== 새 자료 만들기 ===================== */
function create(){
  const s=S.settings, subs=[...new Set(S.decks.map(d=>d.subject).filter(Boolean))];
  const target = V.targetDeck ? deckById(V.targetDeck) : null;
  return `
  <section class="panel">
    <h2>${target?`「${esc(target.title)}」에 더 추가하기`:'새 자료 만들기'}</h2>
    <ol class="steps">
      <li><b>무엇을 만들지 고르기</b> (아래)</li>
      <li><b>부탁 글 복사</b> → ChatGPT에서 <b>PDF를 첨부</b>하고 부탁 글을 붙여넣어 보내기</li>
      <li>ChatGPT 답의 <b>코드 상자 오른쪽 위 '복사'</b>를 눌러 복사 → 아래 3단계 칸에 붙여넣기</li>
    </ol>
  </section>
  <section class="panel">
    <h2>1단계 · 무엇을 만들까요?</h2>
    ${target?`<p class="small muted">과목·자료 이름은 「${esc(target.subject)} · ${esc(target.title)}」 그대로 써요. 앞에서 만든 것과 겹치지 않게 부탁해요.</p>`:`
    <div class="row" style="align-items:flex-start">
      <div style="flex:1;min-width:200px"><label class="f">과목</label>
        <input type="text" id="c_subject" list="subList" placeholder="예: 통합과학" value="${esc(V.subject||'')}">
        <datalist id="subList">${subs.map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div>
      <div style="flex:1;min-width:200px"><label class="f">자료 이름</label>
        <input type="text" id="c_title" placeholder="예: 3단원 세포와 생명" value="${esc(V.title||'')}"></div>
    </div>`}
    <div class="row" style="align-items:flex-start">
      <div style="flex:1;min-width:150px"><label class="f">학년</label>
        <select id="c_level">${['중학생','고등학생','대학생'].map(x=>`<option ${s.level===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div style="flex:1;min-width:150px"><label class="f">시험</label>
        <select id="c_exam">${['중간고사','기말고사','수행평가','모의고사','쪽지시험'].map(x=>`<option ${(s.exam||'').includes(x)?'selected':''}>${x}</option>`).join('')}</select></div>
      <div style="flex:1;min-width:150px"><label class="f">난이도</label>
        <select id="c_diff"><option>쉬움·보통·어려움 골고루</option><option>기본 개념 위주</option><option>실제 시험 수준</option><option>어렵게 (고득점 대비)</option></select></div>
    </div>
    <div class="row" style="align-items:flex-start">
      <div style="flex:1;min-width:150px"><label class="f">플래시카드 수</label>
        <select id="c_ncard">${[0,10,20,30].map(n=>`<option ${n===20?'selected':''} value="${n}">${n?n+'장':'안 만들기'}</option>`).join('')}</select></div>
      <div style="flex:1;min-width:150px"><label class="f">시험문제 수</label>
        <select id="c_nq">${[0,10,15,20,30].map(n=>`<option ${n===15?'selected':''} value="${n}">${n?n+'문제':'안 만들기'}</option>`).join('')}</select></div>
    </div>
    <label class="f">문제 유형</label>
    <div>${Object.entries(TYPE_NAME).map(([k,v])=>`<label class="chk"><input type="checkbox" class="c_type" value="${k}" ${k!=='blank'?'checked':''}> ${v}</label>`).join('')}</div>
    <label class="f">시험 범위·선생님이 강조한 것 (선택)</label>
    <textarea id="c_memo" style="min-height:70px" placeholder="예: 12~35쪽. 선생님이 표 3-2와 실험 과정은 꼭 나온다고 하셨음"></textarea>
    <div class="row" style="margin-top:14px"><button class="pri big" onclick="makePrompt()">부탁 글 만들기 ▶</button></div>
  </section>
  <section class="panel" id="promptBox" style="display:none">
    <h2>2단계 · ChatGPT에 보내기</h2>
    <ol class="steps">
      <li>아래 <b>[부탁 글 복사]</b>를 누르세요.</li>
      <li><b>[ChatGPT 열기]</b> → 입력창 왼쪽 <b>＋</b>(또는 📎)로 수업 <b>PDF를 첨부</b>하세요.</li>

function buildPrompt(o){

[만들 것]
${o.nCard?`- 플래시카드 ${o.nCard}장: front는 용어나 짧은 질문, back은 정확하고 짧은 답(1~2문장). 시험에 잘 나오는 핵심 개념·정의·공식·연도·인물 위주`:''}
${o.nQ?`- 시험문제 ${o.nQ}문제: 아래 유형을 골고루 섞어서
${typeLines}`:''}

4. 결과는 앞뒤 설명 없이, 아래 형식의 JSON 하나만 \`\`\`json 코드블록에 넣어서 출력해. 개수가 많아도 중간에 끊지 말고 끝까지.

\`\`\`json
{
  "subject": "${o.subject}",
  "title": "${o.title||'자료 이름'}",

    {"front": "질문 또는 용어", "back": "답"}
  ],
  "questions": [
    {"type": "mc", "question": "문제", "choices": ["보기1","보기2","보기3","보기4","보기5"], "answer": 2, "explanation": "해설", "source": "p.3"},
    {"type": "ox", "question": "문장", "answer": "X", "explanation": "해설", "source": "p.5"},
    {"type": "short", "question": "문제", "answer": "정답", "accept": ["다른 표현"], "explanation": "해설", "source": "p.7"},
    {"type": "blank", "question": "____ 은/는 ~이다.", "answer": "정답", "accept": [], "explanation": "해설", "source": "p.8"},
    {"type": "essay", "question": "문제", "answer": "모범답안", "points": ["채점 기준1","채점 기준2"], "explanation": "해설", "source": "p.9"}
  ]
}
\`\`\``.replace(/\n{3,}/g,'\n\n');

/* ----- 붙여넣은 답 해석 ----- */
function extractJSON(text){
  let t = String(text||'').trim();
  if(!t) throw new Error('붙여넣은 내용이 없어요.');
  const blocks = [...t.matchAll(/```(?:json|JSON)?\s*([\s\S]*?)```/g)].map(m=>m[1]);
  if(blocks.length) t = blocks.sort((a,b)=>b.length-a.length)[0];
  const s = t.search(/[\[{]/);
  const e = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if(s<0 || e<s) throw new Error('JSON을 찾지 못했어요.');
  let j = t.slice(s, e+1);
  try{ return JSON.parse(j); }catch(err){
    const fixed = j.replace(/,\s*([}\]])/g,'$1').replace(/[“”]/g,'"');
    try{ return JSON.parse(fixed); }catch(err2){ throw new Error('답이 중간에 잘렸거나 형식이 깨졌어요.'); }
  }
}
const CIRCLED = '①②③④⑤⑥⑦⑧⑨⑩';
function stripChoice(c){ return String(c).replace(/^\s*([①-⑩]|\(?\d{1,2}[\).]|[A-Ea-e][\).])\s*/,'').trim(); }
function normQ(q){
  if(!q || typeof q!=='object') return null;
  const tmap={'객관식':'mc','multiple':'mc','multiple_choice':'mc','multiplechoice':'mc','choice':'mc','mcq':'mc',
    'o/x':'ox','ox':'ox','tf':'ox','true_false':'ox','truefalse':'ox','참거짓':'ox',
    '단답형':'short','short':'short','short_answer':'short','주관식':'short',
    '빈칸':'blank','빈칸채우기':'blank','fill':'blank','fill_in_blank':'blank','blank':'blank','cloze':'blank',
    '서술형':'essay','essay':'essay','논술형':'essay'};
  let type = tmap[String(q.type||'').toLowerCase().replace(/\s/g,'')] || '';
  const choicesRaw = q.choices || q.options;
  if(!type) type = Array.isArray(choicesRaw) ? 'mc' : 'short';
  const question = String(q.question ?? q.q ?? q.prompt ?? '').trim();
  if(!question) return null;
  const base = {id:uid(), type, question, explanation:String(q.explanation ?? q.explain ?? q.해설 ?? '').trim(),
    source:String(q.source ?? q.page ?? '').trim(), tries:0, wrongs:0, wrong:false};
  if(type==='mc'){
    if(!Array.isArray(choicesRaw) || choicesRaw.length<2) return null;
    const choices = choicesRaw.map(stripChoice);
    let a = q.answer, idx = -1;
    if(typeof a==='number') idx = a-1;
    else if(typeof a==='string'){
      const s=a.trim(), ci=CIRCLED.indexOf(s[0]);
      if(ci>=0) idx=ci;
      else if(/^\d+/.test(s)) idx=parseInt(s)-1;
      else if(/^[A-Ea-e]$/.test(s)) idx=s.toUpperCase().charCodeAt(0)-65;
      else idx = choices.findIndex(c=>c===stripChoice(s));
    }
    if(!(idx>=0 && idx<choices.length)) return null;
    return {...base, choices, answer:idx};
  }
  if(type==='ox'){
    const a=String(q.answer??'').trim().toUpperCase();
    return {...base, answer: ['O','TRUE','T','참','맞음','○','YES'].includes(a) ? 'O' : 'X'};
  }
  const answer = String(q.answer ?? q.a ?? '').trim();
  if(!answer) return null;
  if(type==='essay') return {...base, answer, points:(Array.isArray(q.points)?q.points:[]).map(String)};
  return {...base, answer, accept:(Array.isArray(q.accept)?q.accept:[]).map(String)};
}
function normalizeImport(obj){
  if(Array.isArray(obj)) obj = obj.length && obj[0] && obj[0].front ? {flashcards:obj} : {questions:obj};
  const cardsRaw = obj.flashcards || obj.cards || obj.플래시카드 || [];
  const cards = cardsRaw.map(c=>({id:uid(), front:String(c.front ?? c.q ?? c.question ?? c.앞면 ?? '').trim(),
    back:String(c.back ?? c.a ?? c.answer ?? c.뒷면 ?? '').trim(), box:0, due:0, seen:0})).filter(c=>c.front && c.back);
  const qsRaw = obj.questions || obj.quiz || obj.문제 || [];
  const questions = qsRaw.map(normQ).filter(Boolean);
  return {subject:String(obj.subject||'').trim(), title:String(obj.title||'').trim(), cards, questions,
    dropped:(cardsRaw.length-cards.length)+(qsRaw.length-questions.length)};
}

      · 답이 길어서 중간에 끊겼다면 ChatGPT에 <b>"개수를 반으로 줄여서 JSON을 처음부터 다시 출력해 줘"</b>라고 보내세요.</span></div>`;
  }
}
function savePending(targetId){
  if(!PENDING) return;
  let d;

    d = deckById(targetId);

  } else {

    const title = $('p_title').value.trim() || ('자료 ' + new Date().toLocaleDateString('ko-KR'));
    d = {id:uid(), subject, title, created:Date.now(), cards:PENDING.cards, questions:PENDING.questions};

  }
  save(); PENDING=null; toast('저장했어요!');
  go('deck',{deckId:d.id});
}

function startFlash(deckId, mode){
  const decks = deckId ? [deckById(deckId)] : S.decks;
  let refs=[];
  decks.forEach(d=>d.cards.forEach(c=>{
    if(mode==='all' || (mode==='due'&&isDue(c)) || (mode==='notyet'&&c.box<3)) refs.push({d:d.id,c:c.id});
  }));
  if(!refs.length){ toast('공부할 카드가 없어요'); return; }
  const rev = $('fs_rev') ? $('fs_rev').checked : false;
  go('flash',{deckId, queue:shuffle(refs), pos:0, flipped:false, rev, tally:{1:0,2:0,3:0}, total:refs.length, after:bindFlashKeys});
}
function curCard(){ const r=V.queue[V.pos]; if(!r) return null; const d=deckById(r.d); return d && {d, c:d.cards.find(x=>x.id===r.c)}; }
function flash(){
  const cur = curCard();
  if(!cur || !cur.c){
    return `<section class="panel" style="text-align:center"><h2>🎉 다 했어요!</h2>
      <p>알아요 <b style="color:var(--ok)">${V.tally[3]}</b> · 헷갈려요 <b style="color:var(--mid)">${V.tally[2]}</b> · 몰라요 <b style="color:var(--bad)">${V.tally[1]}</b></p>
      <p class="muted small">'몰라요' 카드는 오늘 안에 다시 나오고, 아는 카드는 며칠 뒤 복습에 나와요.</p>
      <div class="row" style="justify-content:center">
        ${V.deckId?`<button class="pri" onclick="go('quizSetup',{deckId:'${V.deckId}'})">이어서 문제 풀기</button>`:''}
        <button onclick="go('home')">홈으로</button></div></section>`;
  }
  const {d,c}=cur, front=V.rev?c.back:c.front, back=V.rev?c.front:c.back;
  const done=V.pos;
  return `<div class="prog"><span>${esc(d.title)}</span><span>${done} / ${V.queue.length}</span></div>
    <div class="bar" style="max-width:640px;margin:0 auto"><i style="width:${V.queue.length?done/V.queue.length*100:0}%;background:var(--brand)"></i></div>
    <div class="fc-area"><div class="fc ${V.flipped?'flip':''}" id="fc" onclick="flipCard()">
      <div class="side front"><span class="tag">질문</span>${esc(front)}</div>
      <div class="side back"><span class="tag">답</span>${esc(back)}</div>
    </div></div>
    ${V.flipped ? `<div class="rate">
        <button class="r1" onclick="rate(1)">😵 몰라요<br><span class="kbd">1</span></button>
        <button class="r2" onclick="rate(2)">🤔 헷갈려요<br><span class="kbd">2</span></button>
        <button class="r3" onclick="rate(3)">😎 알아요<br><span class="kbd">3</span></button></div>`
      : `<div style="text-align:center"><button class="pri big" onclick="flipCard()">답 보기 <span class="kbd" style="border-color:#fff8">Space</span></button></div>`}
    <p class="small muted" style="text-align:center;margin-top:14px">카드 상태: ${c.box>=3?'외움':c.box>=1?'익히는 중':'새 카드'} · <a href="#" onclick="go('home');return false" style="color:inherit">그만하기</a></p>`;
}
function flipCard(){ V.flipped=!V.flipped; render(); }
function rate(r){
  const cur=curCard(); if(!cur||!V.flipped) return;
  const c=cur.c; c.seen=(c.seen||0)+1; V.tally[r]++;
  if(r===1){ c.box=1; c.due=0;
    // 몰라요: 이번 공부 안에서 3장 뒤에 다시
    const again = V.queue[V.pos]; V.queue.splice(Math.min(V.pos+4, V.queue.length), 0, again);
  } else if(r===2){ c.box=Math.max(1,c.box); c.due=startOfToday()+DAY; }
  else { c.box=Math.min(5,(c.box||0)+1); c.due=startOfToday()+INTERVALS[c.box]*DAY; }
  save(); V.pos++; V.flipped=false; render();
}
function bindFlashKeys(){
  document.onkeydown = e=>{
    if(V.view!=='flash') return;
    if(e.code==='Space'||e.key==='Enter'){ e.preventDefault(); if(!V.flipped) flipCard(); }
    else if(['1','2','3'].includes(e.key) && V.flipped) rate(+e.key);
  };
}

function quizSetup(){
  const d=deckById(V.deckId); if(!d) return home();
  const cnt={}; d.questions.forEach(q=>cnt[q.type]=(cnt[q.type]||0)+1);
  if(!d.questions.length) return `<section class="panel"><h2>문제가 아직 없어요</h2>
    <button class="pri" onclick="go('create',{targetDeck:'${d.id}'})">ChatGPT로 문제 만들기</button></section>`;
  return `<section class="panel"><h2>✏️ ${esc(d.title)} · 문제 풀기</h2>
    <label class="f">유형</label>
    <div>${Object.entries(cnt).map(([k,v])=>`<label class="chk"><input type="checkbox" class="q_type" value="${k}" checked> ${TYPE_NAME[k]} (${v})</label>`).join('')}</div>
    <label class="f">문제 수</label>
    <select id="q_n" style="max-width:200px">${[5,10,20,30].filter(n=>n<d.questions.length).map(n=>`<option value="${n}" ${n===10?'selected':''}>${n}문제</option>`).join('')}<option value="999" ${d.questions.length<=10?'selected':''}>전부 (${d.questions.length})</option></select>
    <label class="f">방식</label>
    <label class="chk"><input type="radio" name="q_mode" value="practice" checked> 연습 — 한 문제씩 바로 채점·해설</label><br>
    <label class="chk"><input type="radio" name="q_mode" value="exam"> 모의고사 — 끝까지 풀고 한꺼번에 채점</label>
    <div class="row" style="margin-top:14px"><button class="pri big" onclick="startQuiz('${d.id}')">시작 ▶</button></div>
  </section>`;
}
function startQuiz(deckId, onlyIds){
  const d=deckById(deckId);
  let qs;
  if(onlyIds){ qs = shuffle(d.questions.filter(q=>onlyIds.includes(q.id))); }
  else {
    const types=[...document.querySelectorAll('.q_type:checked')].map(x=>x.value);
    if(!types.length){ alert('유형을 하나 이상 골라 주세요'); return; }
    qs = shuffle(d.questions.filter(q=>types.includes(q.type))).slice(0, +$('q_n').value);
  }
  if(!qs.length){ toast('풀 문제가 없어요'); return; }
  const mode = onlyIds ? 'practice' : document.querySelector('input[name=q_mode]:checked').value;
  // 객관식 보기 순서도 섞기
  const order = {}; qs.forEach(q=>{ if(q.type==='mc') order[q.id]=shuffle(q.choices.map((_,i)=>i)); });
  go('quiz',{deckId, ids:qs.map(q=>q.id), pos:0, mode, order, answers:{}, checked:false, start:Date.now(), fromWrong:!!onlyIds});
}
function qById(d,id){ return d.questions.find(q=>q.id===id); }
const norm = s => String(s||'').toLowerCase().replace(/[\s.,·:;'"“”‘’()\[\]{}\-_~!?]/g,'');
function gradeAuto(q, ans){
  if(ans==null || ans==='') return 0;
  if(q.type==='mc') return ans===q.answer?1:0;
  if(q.type==='ox') return ans===q.answer?1:0;
  if(q.type==='short'||q.type==='blank'){
    const a=norm(ans); return [q.answer,...(q.accept||[])].some(x=>norm(x)===a && a) ? 1:0;
  }
  return null; // 서술형은 스스로 채점
}
function quiz(){
  const d=deckById(V.deckId); const q=qById(d, V.ids[V.pos]);
  if(!q) return result();
  const A=V.answers[q.id]||{}, checked=V.checked, mode=V.mode;
  let body='';
  if(q.type==='mc'){
    body = `<div class="choices">${V.order[q.id].map((ci,k)=>{
      let cls = A.val===ci?'sel':'';
      if(checked){ if(ci===q.answer) cls='right'; else if(A.val===ci) cls='wrong'; }
      return `<button class="${cls}" ${checked?'disabled style="opacity:1;cursor:default"':''} onclick="pick(${ci})">${CIRCLED[k]} ${esc(q.choices[ci])}</button>`;
    }).join('')}</div>`;
  } else if(q.type==='ox'){
    body = `<div class="ox">${['O','X'].map(v=>{
      let cls=A.val===v?'sel':''; if(checked){ if(v===q.answer) cls='right'; else if(A.val===v) cls='wrong'; }
      return `<button class="${cls}" ${checked?'disabled style="opacity:1"':''} onclick="pick('${v}')" style="${cls==='sel'?'border-color:var(--brand);background:var(--brand-soft)':cls==='right'?'border-color:var(--ok);background:var(--ok-soft)':cls==='wrong'?'border-color:var(--bad);background:var(--bad-soft)':''}">${v==='O'?'⭕':'❌'}</button>`;
    }).join('')}</div>`;
  } else if(q.type==='essay'){
    body = `<textarea id="ansIn" placeholder="답을 써 보세요" ${checked?'readonly':''}>${esc(A.val||'')}</textarea>`;
  } else {
    body = `<input type="text" id="ansIn" placeholder="정답 입력 후 Enter" value="${esc(A.val||'')}" ${checked?'readonly':''} autocomplete="off">`;
  }
  let fb='';
  if(checked){
    if(q.type==='essay'){
      fb = `<div class="fb mid"><b>모범답안</b>\n${esc(q.answer)}${q.points&&q.points.length?`\n\n<b>채점 기준</b>\n${q.points.map(p=>'· '+esc(p)).join('\n')}`:''}${q.explanation?`\n\n<b>해설</b> ${esc(q.explanation)}`:''}${q.source?`  <span class="small muted">(${esc(q.source)})</span>`:''}</div>
        <p style="margin:12px 0 6px;font-weight:600">내 답은 어땠나요?</p>
        <div class="row">${[[1,'😎 다 맞았어요','ok'],[0.5,'🤔 절반쯤','mid'],[0,'😵 틀렸어요','bad']].map(([s,l])=>
          `<button class="${A.score===s?'pri':''}" onclick="selfGrade(${s})">${l}</button>`).join('')}</div>`;
    } else {
      const ok = A.score===1;
      fb = `<div class="fb ${ok?'ok':'bad'}"><b>${ok?'⭕ 정답!':'❌ 아쉬워요'}</b>${ok?'':`  정답: <b>${esc(answerText(q))}</b>`}${q.explanation?`\n${esc(q.explanation)}`:''}${q.source?`  <span class="small muted">(${esc(q.source)})</span>`:''}</div>
        ${!ok && (q.type==='short'||q.type==='blank') && A.val ? `<button class="ghost small" style="margin-top:8px" onclick="selfGrade(1)">사실 같은 뜻으로 맞게 썼어요</button>`:''}`;
    }
  }
  const last = V.pos===V.ids.length-1;
  let actions='';
  if(mode==='practice'){
    if(!checked) actions = `<button class="pri big" onclick="checkAnswer()">채점하기</button>`;
    else actions = `<button class="pri big" onclick="nextQ()" ${q.type==='essay'&&A.score==null?'disabled':''}>${last?'결과 보기':'다음 문제 ▶'}</button>`;
  } else {
    actions = `${V.pos>0?`<button onclick="moveQ(-1)">◀ 이전</button>`:''}
      <button class="pri big" onclick="moveQ(1)">${last?'제출하고 채점':'다음 ▶'}</button>`;
  }
  return `<div class="prog" style="max-width:none"><span>${esc(d.title)} · ${mode==='exam'?'모의고사':'연습'}</span><span>${V.pos+1} / ${V.ids.length}</span></div>
    <div class="bar"><i style="width:${(V.pos)/V.ids.length*100}%;background:var(--brand)"></i></div>
    <section class="panel" style="margin-top:12px">
      <span class="badge">${TYPE_NAME[q.type]}</span> ${q.wrongs?`<span class="badge bad">전에 ${q.wrongs}번 틀림</span>`:''}
      <div class="q">${V.pos+1}. ${esc(q.question)}</div>
      ${body}${fb}
      <div class="row" style="margin-top:16px">${actions}<span style="flex:1"></span><button class="ghost small" onclick="if(confirm('그만둘까요?'))go('home')">그만하기</button></div>
    </section>`;
}
function readInput(){
  const d=deckById(V.deckId), q=qById(d,V.ids[V.pos]);
  const el=$('ansIn');
  if(el){ V.answers[q.id]=Object.assign(V.answers[q.id]||{}, {val:el.value.trim()}); }
  return q;
}
function pick(v){
  if(V.checked) return;
  const d=deckById(V.deckId), q=qById(d,V.ids[V.pos]);
  V.answers[q.id]={val:v};
  if(V.mode==='practice') checkAnswer(); else render();
}
function checkAnswer(){
  const q=readInput(); const A=V.answers[q.id]||(V.answers[q.id]={val:''});
  if(q.type!=='essay' && (A.val===undefined||A.val==='')){ toast('답을 먼저 골라 주세요'); return; }
  A.score = gradeAuto(q, A.val);
  V.checked=true;
  if(q.type!=='essay') record(q, A.score);
  render();
}
function selfGrade(s){
  const d=deckById(V.deckId), q=qById(d,V.ids[V.pos]);
  const A=V.answers[q.id];
  const prev=A.score; A.score=s;
  if(q.type==='essay' && prev==null) record(q, s);
  else fixRecord(q, prev, s);
  render();
}
function record(q, score){
  q.tries=(q.tries||0)+1;
  if(score<1){ q.wrongs=(q.wrongs||0)+1; q.wrong=true; } else q.wrong=false;
  save();
}
function fixRecord(q, prev, now){
  if(prev<1 && now>=1){ q.wrongs=Math.max(0,(q.wrongs||1)-1); q.wrong=false; }
  else if(prev>=1 && now<1){ q.wrongs=(q.wrongs||0)+1; q.wrong=true; }
  save();
}
function nextQ(){ V.pos++; V.checked=false; if(V.pos>=V.ids.length) finishQuiz(); else { render(); focusAns(); } }
function moveQ(step){
  readInput();
  if(step>0 && V.pos===V.ids.length-1){
    const d=deckById(V.deckId);
    const blank=V.ids.filter(id=>{const a=V.answers[id]; return !a||a.val===undefined||a.val==='';}).length;
    if(blank && !confirm(`안 푼 문제가 ${blank}개 있어요. 그래도 제출할까요?`)) return;
    V.ids.forEach(id=>{ const q=qById(d,id), A=V.answers[id]||(V.answers[id]={val:''});
      A.score=gradeAuto(q,A.val); if(q.type!=='essay') record(q,A.score); });
    finishQuiz(); return;
  }
  V.pos=Math.max(0,V.pos+step); render(); focusAns();
}
function finishQuiz(){ V.view='result'; V.time=Math.round((Date.now()-V.start)/1000); render(); window.scrollTo(0,0); }
function focusAns(){ const el=$('ansIn'); if(el && el.tagName==='INPUT') el.focus(); }
function result(){
  const d=deckById(V.deckId);
  const qs=V.ids.map(id=>qById(d,id)).filter(Boolean);
  const pending = qs.filter(q=>q.type==='essay' && (V.answers[q.id]||{}).score==null).length;
  const score = qs.reduce((s,q)=>s+((V.answers[q.id]||{}).score||0),0);
  const pct = qs.length?Math.round(score/qs.length*100):0;
  const msg = pct>=90?'완벽해요! 🏆':pct>=70?'잘했어요! 👏':pct>=50?'조금만 더! 💪':'오답노트로 한 번 더 해 봐요 📕';
  return `<section class="panel" style="text-align:center">
      <div class="muted">${esc(d.title)} · ${V.mode==='exam'?'모의고사':'연습'} 결과</div>
      <div style="font-size:52px;font-weight:800;color:var(--brand)">${pct}점</div>
      <div>${qs.length}문제 중 ${score}개 맞음 · ${Math.floor(V.time/60)}분 ${V.time%60}초</div>
      <p style="font-weight:700">${msg}</p>
      ${pending?`<p class="fb mid small">서술형 ${pending}문제는 아래에서 모범답안과 비교해 스스로 채점해 주세요.</p>`:''}
      <div class="row" style="justify-content:center">
        <button class="pri" onclick="go('wrongs',{deckId:'${d.id}'})">오답노트 보기</button>
        <button onclick="go('quizSetup',{deckId:'${d.id}'})">다시 풀기</button>
        <button onclick="go('home')">홈으로</button></div>
    </section>
    <section class="panel"><h2>문제별 확인</h2><div class="list">
    ${qs.map((q,i)=>{ const A=V.answers[q.id]||{}; const s=A.score;
      const mine = q.type==='mc' ? (A.val!==undefined&&A.val!==''?`${q.choices[A.val]}`:'(안 풂)') : (A.val||'(안 풂)');
      return `<div class="item">
        <div><span class="badge ${s===1?'ok':s===0.5?'mid':s===0?'bad':''}">${s===1?'정답':s===0.5?'부분':s===0?'오답':'채점 필요'}</span>
          <span class="badge">${TYPE_NAME[q.type]}</span> <b class="pre">${i+1}. ${esc(q.question)}</b></div>
        <div class="small pre" style="margin-top:4px">내 답: ${esc(mine)}\n정답: ${esc(answerText(q))}</div>
        ${q.type==='essay'&&q.points&&q.points.length?`<div class="small muted pre">채점 기준: ${q.points.map(esc).join(' / ')}</div>`:''}
        ${q.explanation?`<div class="small muted pre">해설: ${esc(q.explanation)} ${q.source?`(${esc(q.source)})`:''}</div>`:''}
        ${q.type==='essay'?`<div class="row" style="margin-top:6px">${[[1,'맞음'],[0.5,'절반'],[0,'틀림']].map(([v,l])=>`<button class="small ${s===v?'pri':''}" onclick="gradeLater('${q.id}',${v})">${l}</button>`).join('')}</div>`
          : (s===0 && A.val && (q.type==='short'||q.type==='blank'))?`<button class="ghost small" onclick="gradeLater('${q.id}',1)">같은 뜻으로 맞게 썼어요</button>`:''}
      </div>`;}).join('')}
    </div></section>`;
}
function gradeLater(qid, s){
  const d=deckById(V.deckId), q=qById(d,qid), A=V.answers[qid]||(V.answers[qid]={val:''});
  const prev=A.score; A.score=s;
  if(prev==null) record(q,s); else fixRecord(q,prev,s);
  render();
}

function exportAll(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  const dt=new Date(); const stamp=`${dt.getFullYear()}${String(dt.getMonth()+1).padStart(2,'0')}${String(dt.getDate()).padStart(2,'0')}`;
  a.href=URL.createObjectURL(blob); a.download=`시험공부_백업_${stamp}.json`; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); toast('백업 파일을 저장했어요 (다운로드 폴더)');
}
function importAll(){
  const inp=$('fileIn'); inp.value='';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const data=JSON.parse(rd.result);
        if(data && Array.isArray(data.decks)){
          const mode = S.decks.length ? confirm('확인 = 지금 자료에 합치기\n취소 = 백업 내용으로 통째로 바꾸기') : true;
          if(mode){ const ids=new Set(S.decks.map(d=>d.id)); data.decks.forEach(d=>{ if(!ids.has(d.id)) S.decks.push(d); }); }
          else S=data;
          save(); toast('불러왔어요'); go('home');
        } else {
          // ChatGPT JSON 파일을 바로 넣은 경우
          const n=normalizeImport(data);
          if(!n.cards.length && !n.questions.length) throw 0;
          S.decks.push({id:uid(),subject:n.subject||'기타',title:n.title||f.name.replace(/\.json$/,''),created:Date.now(),cards:n.cards,questions:n.questions});
          save(); toast('자료로 추가했어요'); go('home');
        }
      }catch(e){ alert('이 파일은 읽을 수 없어요. 백업 파일(.json)인지 확인해 주세요.'); }
    };
    rd.readAsText(f,'utf-8');
  };
  inp.click();
}
